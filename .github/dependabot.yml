version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
